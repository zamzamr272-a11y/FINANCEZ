    </button>

    <header class="topbar">
      <div class="mobile-brand"><img class="logo logo-on-light" src="./assets/finance-logo.svg" alt="FINANCE"><img class="logo logo-on-dark" src="./assets/finance-logo-dark.svg" alt="" aria-hidden="true"></div>

        <button class="icon-button notification-button" id="notification-button" aria-label="Notifikasi" title="Notifikasi"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-bell"/></svg><i></i></button>
        <button class="top-avatar" data-view="profile" id="top-avatar" aria-label="Profil">N</button>
      </div>
    </header>
    <div class="preview-banner" id="preview-banner">
      <span class="banner-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-info"/></svg></span>

      <button id="banner-connect">Hubungkan</button>
      <button class="banner-close" id="banner-close" aria-label="Tutup"><svg class="icon icon-sm" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
